services:
  - type: web
    name: a4-vu-nguyen
    runtime: node
    plan: free
    repo: https://github.com/vhmnguyen/a4-Vu-Nguyen
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dnd_party_tracker_a4
      - key: SESSION_SECRET
        generateValue: true
